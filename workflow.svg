<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How I approach an ML problem</title>
<desc id="d">Five stages: frame the problem, data and features, model, evaluate, serve and monitor. The last stage is in progress.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A101C"/><stop offset="1" stop-color="#111C33"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#C9D3E6" stroke-opacity="0.045"/></pattern>
  <style>
    .flow { stroke-dasharray: 4 10; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
</defs>
<rect width="1200" height="214" rx="14" fill="url(#bg)"/><rect width="1200" height="214" rx="14" fill="url(#grid)"/>
<line x1="110.0" y1="78" x2="1090.0" y2="78" stroke="#7F8FAE" stroke-opacity="0.4" stroke-width="1.2"/>
<line class="flow" x1="110.0" y1="78" x2="845.0" y2="78" stroke="#5EC8E5" stroke-width="1.8" stroke-linecap="round"/>
<line x1="845.0" y1="78" x2="1090.0" y2="78" stroke="#7F8FAE" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round"/>
<circle cx="110" cy="78" r="17" fill="#0A101C" stroke="#5EC8E5" stroke-width="1.8"/>
<circle cx="110" cy="78" r="5" fill="#5EC8E5"/>
<text x="110" y="124" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#F3F6FC" text-anchor="middle">Frame</text>
<text x="110" y="148" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#C9D3E6" fill-opacity="0.9" text-anchor="middle">Define the metric</text>
<text x="110" y="168" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#7F8FAE" text-anchor="middle">and what a wrong answer costs</text>
<circle cx="355" cy="78" r="17" fill="#0A101C" stroke="#5EC8E5" stroke-width="1.8"/>
<circle cx="355" cy="78" r="5" fill="#5EC8E5"/>
<text x="355" y="124" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#F3F6FC" text-anchor="middle">Data</text>
<text x="355" y="148" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#C9D3E6" fill-opacity="0.9" text-anchor="middle">Leakage-safe splits</text>
<text x="355" y="168" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#7F8FAE" text-anchor="middle">time-based where order matters</text>
<circle cx="600" cy="78" r="17" fill="#0A101C" stroke="#5EC8E5" stroke-width="1.8"/>
<circle cx="600" cy="78" r="5" fill="#5EC8E5"/>
<text x="600" y="124" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#F3F6FC" text-anchor="middle">Model</text>
<text x="600" y="148" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#C9D3E6" fill-opacity="0.9" text-anchor="middle">Baseline first</text>
<text x="600" y="168" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#7F8FAE" text-anchor="middle">then earn every added complexity</text>
<circle cx="845" cy="78" r="17" fill="#0A101C" stroke="#5EC8E5" stroke-width="1.8"/>
<circle cx="845" cy="78" r="5" fill="#5EC8E5"/>
<text x="845" y="124" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#F3F6FC" text-anchor="middle">Evaluate</text>
<text x="845" y="148" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#C9D3E6" fill-opacity="0.9" text-anchor="middle">Beyond accuracy</text>
<text x="845" y="168" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#7F8FAE" text-anchor="middle">recall, precision, ROC-AUC, MAPE</text>
<circle cx="1090" cy="78" r="17" fill="#0A101C" stroke="#F2B84B" stroke-width="1.8" stroke-dasharray="4 4"/>
<circle cx="1090" cy="78" r="5" fill="#F2B84B"/>
<text x="1090" y="124" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#F3F6FC" text-anchor="middle">Serve</text>
<text x="1090" y="148" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#C9D3E6" fill-opacity="0.9" text-anchor="middle">APIs, containers, monitoring</text>
<text x="1090" y="168" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#F2B84B" text-anchor="middle">in progress</text>
</svg>